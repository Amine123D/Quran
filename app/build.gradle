plugins { id 'com.android.application' }

android { namespace 'com.amine.quranhadith'; compileSdk 35
    defaultConfig { applicationId 'com.amine.quranhadith'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }
}

dependencies { implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'androidx.webkit:webkit:1.12.1' }

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
